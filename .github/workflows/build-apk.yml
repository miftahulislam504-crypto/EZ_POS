name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android folder and permissions
        run: bash tool/bootstrap.sh

      - name: Analyze (log only, does not stop the build)
        run: flutter analyze || true

      - name: Create dart_defines.json from secrets
        run: |
          echo '{"SUPABASE_URL":"${{ secrets.SUPABASE_URL }}","SUPABASE_ANON_KEY":"${{ secrets.SUPABASE_ANON_KEY }}"}' > dart_defines.json

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - uses: actions/upload-artifact@v4
        with:
          name: ez-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
